<div class="login-container">
    <mat-card appearance="outlined" class="login-card">
        <mat-card-header>
            <mat-card-title>Iniciar Sesión</mat-card-title>
            <mat-card-subtitle>Agenda Institucional</mat-card-subtitle>
        </mat-card-header>

        @if (isLoading()) {
        <mat-progress-bar mode="indeterminate"></mat-progress-bar>
        }

        <mat-card-content>
            @if (errorMessage()) {
            <div class="error-banner" role="alert">
                <mat-icon color="warn">error</mat-icon>
                <span>{{ errorMessage() }}</span>
            </div>
            }

            <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
                <mat-form-field appearance="outline">
                    <mat-label>Correo Electrónico</mat-label>
                    <input matInput type="email" formControlName="email" placeholder="usuario@institucion.edu" />
                    <mat-icon matPrefix>email</mat-icon>
                </mat-form-field>

                <mat-form-field appearance="outline">
                    <mat-label>Contraseña</mat-label>
                    <input matInput [type]="hidePassword() ? 'password' : 'text'" formControlName="password" />
                    <mat-icon matPrefix>lock</mat-icon>
                    <button mat-icon-button matSuffix type="button" (click)="hidePassword.set(!hidePassword())">
                        <mat-icon>{{ hidePassword() ? 'visibility_off' : 'visibility' }}</mat-icon>
                    </button>
                </mat-form-field>

                <button mat-flat-button color="primary" type="submit" [disabled]="isLoading()" class="submit-btn">
                    Ingresar
                </button>
            </form>
        </mat-card-content>
    </mat-card>
</div>
